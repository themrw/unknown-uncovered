name: Upload to YouTube
# Platforms: YouTube Shorts, Instagram Reels (via Facebook Page), Facebook Page Reels

# Runs whenever a video folder's meta.json is pushed, or by hand from the Actions tab.
# Uploads every folder under videos/ that has meta.json + an .mp4 but no uploaded.json yet.
on:
  push:
    branches: [master, main]
    paths: ["videos/**/meta.json", ".github/workflows/upload.yml"]
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours: retry pending thumbnails / posts
  workflow_dispatch:
    inputs:
      folder:
        description: "Only this folder (e.g. videos/002_richest_countries). Leave empty for all pending."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write credentials
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$CLIENT_SECRET_JSON" ] || [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "::error::Add CLIENT_SECRET_JSON and YOUTUBE_TOKEN_JSON in Settings > Secrets and variables > Actions"
            exit 1
          fi
          umask 077
          printf '%s' "$CLIENT_SECRET_JSON" > "$RUNNER_TEMP/cs.json"
          printf '%s' "$YOUTUBE_TOKEN_JSON" > "$RUNNER_TEMP/tok.json"

      - name: Check YouTube sign-in
        run: |
          echo "Signed in as:"
          python3 tools/uu_youtube.py whoami "$RUNNER_TEMP/cs.json" "$RUNNER_TEMP/tok.json"

      - name: Upload pending videos
        env:
          ONLY_FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -euo pipefail
          if [ -n "${ONLY_FOLDER:-}" ]; then dirs="${ONLY_FOLDER%/}"; else dirs=$(find videos -mindepth 1 -maxdepth 1 -type d | sort); fi
          uploaded=0
          for d in $dirs; do
            [ -f "$d/meta.json" ] || continue
            [ -f "$d/uploaded.json" ] && { echo "skip $d (already uploaded)"; continue; }
            v=$(find "$d" -maxdepth 1 -name '*.mp4' | head -1)
            [ -n "$v" ] || { echo "::warning::$d has no .mp4"; continue; }
            echo "Uploading $v"
            python3 tools/uu_youtube.py upload "$RUNNER_TEMP/cs.json" "$RUNNER_TEMP/tok.json" "$v" "$d/meta.json" > "$RUNNER_TEMP/out.json"
            mv "$RUNNER_TEMP/out.json" "$d/uploaded.json"
            cat "$d/uploaded.json"
            url=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['url'])" "$d/uploaded.json")
            echo "- **$d** → $url" >> "$GITHUB_STEP_SUMMARY"
            uploaded=$((uploaded+1))
          done

      - name: Set pending YouTube thumbnails
        continue-on-error: true
        run: |
          set -uo pipefail
          for d in $(find videos -mindepth 1 -maxdepth 1 -type d | sort); do
            [ -f "$d/uploaded.json" ] && [ -f "$d/thumbnail.jpg" ] || continue
            [ -f "$d/thumbnail.json" ] && continue
            vid=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('id',''))" "$d/uploaded.json")
            [ -n "$vid" ] || continue
            echo "Setting thumbnail for $d ($vid)"
            if python3 tools/uu_youtube.py thumbnail "$RUNNER_TEMP/cs.json" "$RUNNER_TEMP/tok.json" "$vid" "$d/thumbnail.jpg" > "$RUNNER_TEMP/th.json"; then
              mv "$RUNNER_TEMP/th.json" "$d/thumbnail.json"
              echo "- Thumbnail set for **$d**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Thumbnail for $d not set yet (will retry on the next run)"
            fi
          done

      - name: Post pending reels to Instagram
        if: always()
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          ONLY_FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -euo pipefail
          if [ -n "${INSTAGRAM_ACCESS_TOKEN:-}" ]; then
            mode=ig; echo "Instagram account:"; python3 tools/uu_instagram.py whoami "$INSTAGRAM_ACCESS_TOKEN"
          elif [ -n "${FACEBOOK_PAGE_TOKEN:-}" ] && [ -n "${FACEBOOK_PAGE_ID:-}" ]; then
            mode=page; echo "Instagram via Facebook Page:"; python3 tools/uu_instagram.py whoami-page "$FACEBOOK_PAGE_ID" "$FACEBOOK_PAGE_TOKEN"
          else echo "No Instagram credentials, skipping Instagram"; exit 0; fi
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          if [ -n "${ONLY_FOLDER:-}" ]; then dirs="${ONLY_FOLDER%/}"; else dirs=$(find videos -mindepth 1 -maxdepth 1 -type d | sort); fi
          for d in $dirs; do
            [ -f "$d/meta.json" ] || continue
            [ -f "$d/instagram.json" ] && { echo "skip $d (already on Instagram)"; continue; }
            v=$(find "$d" -maxdepth 1 -name '*.mp4' | head -1)
            [ -n "$v" ] || continue
            echo "Posting $v to Instagram"
            if [ "$mode" = ig ]; then
              python3 tools/uu_instagram.py upload "$INSTAGRAM_ACCESS_TOKEN" "$v" "$d/meta.json" > "$RUNNER_TEMP/ig.json"
            else
              python3 tools/uu_instagram.py upload-page "$FACEBOOK_PAGE_ID" "$FACEBOOK_PAGE_TOKEN" "$v" "$d/meta.json" > "$RUNNER_TEMP/ig.json"
            fi
            mv "$RUNNER_TEMP/ig.json" "$d/instagram.json"
            cat "$d/instagram.json"
            url=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['url'])" "$d/instagram.json")
            echo "- Instagram **$d** → $url" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Post pending reels to Facebook Page
        if: always()
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          ONLY_FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -euo pipefail
          if [ -z "${FACEBOOK_PAGE_ID:-}" ] || [ -z "${FACEBOOK_PAGE_TOKEN:-}" ]; then echo "No Facebook secrets, skipping Facebook"; exit 0; fi
          echo "Facebook Page:"; python3 tools/uu_facebook.py whoami "$FACEBOOK_PAGE_ID" "$FACEBOOK_PAGE_TOKEN"
          if [ -n "${ONLY_FOLDER:-}" ]; then dirs="${ONLY_FOLDER%/}"; else dirs=$(find videos -mindepth 1 -maxdepth 1 -type d | sort); fi
          for d in $dirs; do
            [ -f "$d/meta.json" ] || continue
            [ -f "$d/facebook.json" ] && { echo "skip $d (already on Facebook)"; continue; }
            v=$(find "$d" -maxdepth 1 -name '*.mp4' | head -1)
            [ -n "$v" ] || continue
            echo "Posting $v to Facebook"
            python3 tools/uu_facebook.py upload "$FACEBOOK_PAGE_ID" "$FACEBOOK_PAGE_TOKEN" "$v" "$d/meta.json" > "$RUNNER_TEMP/fb.json"
            mv "$RUNNER_TEMP/fb.json" "$d/facebook.json"
            cat "$d/facebook.json"
            url=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['url'])" "$d/facebook.json")
            echo "- Facebook **$d** → $url" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Record results
        if: always()
        run: |
          git config user.name "uu-uploader"
          git config user.email "uu-uploader@users.noreply.github.com"
          git add videos/*/uploaded.json videos/*/instagram.json videos/*/thumbnail.json videos/*/facebook.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to record"; exit 0; fi
          git commit -m "Record upload results [skip ci]"
          git push
