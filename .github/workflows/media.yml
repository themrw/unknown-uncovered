name: Fetch media (Wikimedia Commons)

# Push media/requests/<name>.json -> downloads openly licensed images into media/<name>/ with credits.json, commits them.
on:
  push:
    branches: [master]
    paths: ["media/requests/**.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Fetch
        run: |
          pip install --quiet pillow
          python3 tools/fetch_media.py
      - name: Commit
        run: |
          git config user.name "uu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media || true
          git diff --cached --quiet && exit 0
          git commit -m "Media fetched [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
